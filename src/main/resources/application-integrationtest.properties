eureka.client.fetch-registry=false
eureka.client.enabled=false

logging.level.root=${LOG_LEVEL:warn}

server.port=${SERVER_PORT:8000}
server.ssl.enabled=false

spring.application.name=product-retriever-service
spring.main.banner-mode=off

spring.datasource.url=jdbc:h2:mem:public
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=false
spring.sql.init.mode=always

spring.flyway.enabled=true
spring.flyway.validate-on-migrate=true
spring.flyway.baseline-on-migrate=true

spring.security.oauth2.resourceserver.jwt.issuer-uri=false
spring.security.oauth2.resourceserver.opaquetoken.client-id=false
spring.security.oauth2.resourceserver.opaquetoken.client-secret=false
spring.security.oauth2.resourceserver.opaquetoken.introspection-uri=false

# Variables to inject into Java variables
ebayTokenUrl=${EBAY_TOKEN_URL:https://api.ebay.com/identity/v1/oauth2/token}
ebayItemSummaryApiUrl=${EBAY_BROWSE_API_ITEM_SUMMARY_URL:https://api.ebay.com/buy/browse/v1/item_summary/search}
ebayGetItemApiUrl=${EBAY_BROWSE_API_GET_ITEM_URL:https://api.ebay.com/buy/browse/v1/item}
principalRoleName=${PRINCIPAL_ROLE_NAME:administrator}
